<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛谷题解站</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --main-purple: #7f54d7;
  --light-purple: #b08fff;
  --dark-bg: #0d0d1a;
  --card-bg: rgba(22, 22, 40, 0.75);
  --glass-blur: blur(10px);
  --text-primary: #f0f0ff;
  --text-secondary: #b4b4cc;
  --danger: #ff4757;
  --border-subtle: rgba(127, 84, 215, 0.18);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--dark-bg);
  background-image:
    radial-gradient(circle at 10% 20%, rgba(127, 84, 215, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 90% 80%, rgba(176, 143, 255, 0.08) 0%, transparent 45%);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.65;
  animation: pageFadeIn 0.7s ease-out;
}
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.container-wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ========== 导航栏（对标 GitHub 导航结构） ========== */
header {
  backdrop-filter: var(--glass-blur);
  background: rgba(18, 18, 35, 0.6);
  border-bottom: 1px solid var(--border-subtle);
  padding: 16px 0;
  position: sticky;
  top: 0;
  z-index: 99;
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo-text {
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--light-purple), #ffffff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 1px;
}
.nav-actions button {
  padding: 8px 16px;
  margin-left: 10px;
  border-radius: 8px;
  border: 1px solid rgba(176, 143, 255, 0.3);
  background: transparent;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.nav-actions button::before {
  content: "";
  position: absolute;
  left: -100%;
  top: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(127, 84, 215, 0.35), transparent);
  transition: left 0.4s ease;
}
.nav-actions button:hover::before { left: 100%; }
.nav-actions button:hover {
  border-color: var(--light-purple);
  box-shadow: 0 0 12px rgba(127, 84, 215, 0.35);
}

/* ========== 头部横幅 Hero 区（GitHub 首页大区块风格） ========== */
.hero-banner {
  padding: 60px 0 40px;
  text-align: center;
  position: relative;
}
.hero-banner::before {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(127, 84, 215, 0.15) 0%, transparent 70%);
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 0;
  filter: blur(40px);
}
.hero-content {
  position: relative;
  z-index: 1;
}
.hero-title {
  font-size: 42px;
  margin-bottom: 16px;
  background: linear-gradient(90deg, #fff, var(--light-purple));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-desc {
  max-width: 680px;
  margin: 0 auto 30px;
  color: var(--text-secondary);
  font-size: 17px;
}

/* ========== 搜索栏区块 ========== */
.search-wrapper {
  backdrop-filter: var(--glass-blur);
  background: var(--card-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 18px 22px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 32px;
}
#searchPid {
  flex: 1;
  min-width: 260px;
  background: rgba(15,15,30,0.6);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 11px 15px;
  color: #fff;
  font-size: 15px;
  transition: 0.3s;
}
#searchPid:focus {
  outline: none;
  border-color: var(--light-purple);
  box-shadow: 0 0 15px rgba(176, 143, 255, 0.3);
}

/* ========== 按钮样式 ========== */
.btn-primary {
  background: linear-gradient(135deg, var(--main-purple), #915cf0);
  border: none;
  color: white;
  padding: 11px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 500;
}
.btn-primary:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 18px rgba(127, 84, 215, 0.5);
  transform: translateY(-2px);
}
.btn-gray {
  background: rgba(60,60,90,0.55);
  border: 1px solid rgba(170,170,200,0.25);
  color: var(--text-primary);
  padding: 11px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.btn-gray:hover {
  border-color: rgba(176, 143, 255, 0.4);
  box-shadow: 0 0 10px rgba(127, 84, 215, 0.2);
}
.btn-danger {
  background: var(--danger);
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 7px;
  cursor: pointer;
  transition: 0.25s;
  font-size: 14px;
}
.btn-danger:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 12px rgba(255, 71, 87, 0.45);
}
.action-bar {
  margin: 0 0 28px;
}

/* ========== 弹窗样式 ========== */
.modal-box {
  backdrop-filter: var(--glass-blur);
  background: var(--card-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 24px 26px;
  margin: 20px 0;
  box-shadow: 0 0 30px rgba(127, 84, 215, 0.12);
  transform: scale(0.95);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1);
}
.modal-box:not(.hide) {
  transform: scale(1);
  opacity: 1;
}
.modal-box h3 {
  margin-bottom: 16px;
  color: var(--light-purple);
  font-size: 20px;
}
input, textarea, select {
  width: 100%;
  background: rgba(15,15,30,0.6);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px 15px;
  margin: 8px 0;
  color: #fff;
  font-size: 15px;
  transition: 0.3s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--light-purple);
  box-shadow: 0 0 16px rgba(176, 143, 255, 0.32);
}

/* ========== 题解卡片（对标 GitHub Repo 卡片风格 + 炫酷悬浮） ========== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 36px 0 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.section-title {
  font-size: 22px;
  color: #fff;
}
.solution-card {
  backdrop-filter: var(--glass-blur);
  background: var(--card-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 24px 26px;
  margin: 16px 0;
  transition: all 0.35s ease;
  position: relative;
  overflow: hidden;
}
.solution-card::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(127, 84, 215, 0.08), transparent);
  transition: left 0.5s ease;
}
.solution-card:hover::after {
  left: 100%;
}
.solution-card:hover {
  transform: translateY(-5px);
  border-color: rgba(127, 84, 215, 0.45);
  box-shadow: 0 8px 35px rgba(127, 84, 215, 0.22);
}
.tag-diff {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  margin-left: 12px;
  background: rgba(127, 84, 215, 0.18);
  color: var(--light-purple);
  border: 1px solid rgba(176, 143, 255, 0.25);
}
.hide {
  display: none !important;
}
.markdown-body pre {
  background: rgba(10,10,22,0.7);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 14px 0;
  border-left: 3px solid var(--main-purple);
}
.markdown-body code {
  background: rgba(30,30,55,0.65);
  padding: 3px 7px;
  border-radius: 6px;
  font-family: Consolas, monospace;
  color: #ffd8ff;
}
.text-muted {
  color: var(--text-secondary);
  font-size: 14px;
}
.empty-tip {
  text-align: center;
  padding: 50px 0;
  color: var(--text-secondary);
  font-size: 16px;
}
.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}
.card-footer {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
}

/* ========== 底部署名页脚（全局固定） ========== */
footer {
  margin-top: 70px;
  padding: 40px 0 30px;
  border-top: 1px solid var(--border-subtle);
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
}
.footer-author {
  font-size: 16px;
  margin-bottom: 8px;
  color: var(--light-purple);
}

/* 移动端适配 */
@media (max-width: 660px) {
  .header-inner {
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }
  .search-wrapper {
    flex-direction: column;
    align-items: stretch;
  }
  .hero-title {
    font-size: 28px;
  }
}
</style>
</head>
<body>
<header>
  <div class="container-wrap header-inner">
    <div class="logo-text">洛谷题解站</div>
    <div class="nav-actions" id="userBar">
      <button onclick="location.href='auth.html'">登录 / 注册</button>
    </div>
  </div>
</header>

<div class="container-wrap">
  <section class="hero-banner">
    <div class="hero-content">
      <h1 class="hero-title">收集、分享洛谷编程题解</h1>
      <p class="hero-desc">注册账号即可发布你的解题思路、代码与笔记，支持 Markdown 排版与 LaTeX 数学公式渲染，公开查阅所有用户分享的题解内容</p>
    </div>
  </section>

  <div class="search-wrapper">
    <input id="searchPid" placeholder="输入题号快速搜索（例：P1001）">
    <button class="btn-primary" onclick="searchSol()">搜索</button>
    <button class="btn-gray" onclick="loadAllSol()">全部题解</button>
  </div>

  <div class="action-bar">
    <button id="publishingBtn" class="hide btn-primary" onclick="openPublish()">发布新题解</button>
  </div>

  <!-- 发布弹窗 -->
  <div id="publishingPanel" class="modal-box hide">
    <h3>发布题解</h3>
    <input id="pid" placeholder="洛谷题号，例如 P1001">
    <input id="pname" placeholder="题目全称">
    <select id="diff">
      <option value="">选择难度分级</option>
      <option>入门</option>
      <option>普及-</option>
      <option>普及/提高-</option>
      <option>普及+/提高</option>
      <option>提高+/省选-</option>
      <option>省选/NOI-</option>
      <option>NOI/NOI+/CTSC</option>
    </select>
    <textarea id="solContent" rows="12" placeholder="支持 Markdown 排版、$$数学公式$$、代码块粘贴"></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="submitSolution()">提交发布</button>
      <button class="btn-gray" onclick="closePublish()">取消</button>
    </div>
  </div>

  <div class="section-header">
    <h2 class="section-title">全部题解列表</h2>
  </div>
  <div id="solList"></div>

  <!-- 页脚署名 -->
  <footer>
    <div class="footer-author">作者：BoHyCar</div>
    <div>洛谷题解站 · 开源学习项目 · Copyright © 2026 All Rights Reserved</div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lvvbvxjqpecjyumrtbgi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dmJ2eGpxcGVjanl1bXJ0YmdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjQ5MjYsImV4cCI6MjA5NzYwMDkyNn0.N90WEhvUllsBHekYbiMQIixhKUSFXu00P9gKI4ZRAoM";
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

document.addEventListener('DOMContentLoaded', () => {
  marked.setOptions({gfm:true, breaks:true});
  initUser();
  loadAllSol();
});

async function initUser(){
  const {data:{user}} = await sbClient.auth.getUser();
  currentUser = user;
  const bar = document.getElementById('userBar');
  const pubBtn = document.getElementById('publishingBtn');
  if(user){
    bar.innerHTML = `<span style="margin-right:10px">欢迎 ${user.email}</span><button class="btn-gray" style="padding:6px 12px;font-size:14px" onclick="logout()">退出登录</button>`;
    pubBtn.classList.remove('hide');
  }else{
    bar.innerHTML = `<button onclick="location.href='auth.html'">登录 / 注册</button>`;
    pubBtn.classList.add('hide');
  }
}

async function logout(){
  await sbClient.auth.signOut();
  location.reload();
}

function openPublish(){document.getElementById('publishingPanel').classList.remove('hide')}
function closePublish(){document.getElementById('publishingPanel').classList.add('hide')}

async function submitSolution(){
  if(!currentUser) {
    alert('请先登录账号');
    location.href='auth.html';
    return;
  }
  const pid = document.getElementById('pid').value.trim();
  const pname = document.getElementById('pname').value.trim();
  const diff = document.getElementById('diff').value;
  const content = document.getElementById('solContent').value.trim();
  if(!pid||!pname||!content) return alert('题号、题目名称、题解内容不能为空');

  const {error} = await sbClient.from('solutions').insert([{
    user_id:currentUser.id,
    luogu_pid:pid,
    problem_name:pname,
    difficulty:diff,
    content:content
  }]);
  if(error){
    alert("发布失败："+error.message);
    console.error(error);
  }else{
    document.getElementById('pid').value='';
    document.getElementById('pname').value='';
    document.getElementById('solContent').value='';
    closePublish();
    loadAllSol();
  }
}

function renderSol(list){
  const wrap = document.getElementById('solList');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty-tip">暂无题解，快来发布第一篇题解吧✨</div>`;
    return;
  }
  let html = '';
  list.forEach(item=>{
    let mdHtml = marked.parse(item.content);
    mdHtml = katex.renderToString(mdHtml,{throwOnError:false});
    let delBtn = '';
    if(currentUser && currentUser.id === item.user_id){
      delBtn = `<button class="btn-danger" onclick="delSol(${item.id})">删除本题解</button>`;
    }
    html += `
    <div class="solution-card markdown-body">
      <div style="margin-bottom:12px;">
        <strong style="font-size:18px;color:#fff">${item.luogu_pid} ${item.problem_name}</strong>
        <span class="tag-diff">${item.difficulty||'未设置难度'}</span>
      </div>
      ${mdHtml}
      <div class="card-footer">
        <div class="text-muted">
          作者UID：${item.user_id}<br>
          发布时间：${new Date(item.created_at).toLocaleString()}
        </div>
        <div style="margin-top:10px;">${delBtn}</div>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
}

async function loadAllSol(){
  const {data,error} = await sbClient.from('solutions')
      .select('*')
      .order('created_at',{ascending:false});
  if(error){
    console.error("加载题解异常",error);
    return;
  }
  renderSol(data);
}

async function searchSol(){
  const key = document.getElementById('searchPid').value.trim().toUpperCase();
  if(!key) return loadAllSol();
  const {data,error} = await sbClient.from('solutions')
      .select('*')
      .ilike('luogu_pid',`%${key}%`)
      .order('created_at',{ascending:false});
  if(error){
    console.error(error);
    return;
  }
  renderSol(data);
}

async function delSol(id){
  if(!confirm('确定永久删除该题解？无法恢复')) return;
  const {error} = await sbClient.from('solutions').delete().eq('id',id);
  if(error){
    alert("删除失败："+error.message);
  }else loadAllSol();
}
</script>
</body>
</html>
