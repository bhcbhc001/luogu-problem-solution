<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 - 洛谷题解站</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --main-purple: #7f54d7;
  --light-purple: #b08fff;
  --dark-bg: #0d0d1a;
  --card-bg: rgba(22, 22, 40, 0.75);
  --glass-blur: blur(12px);
  --text-primary: #f0f0ff;
  --text-secondary: #b4b4cc;
}
body {
  font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  background: var(--dark-bg);
  background-image:
    radial-gradient(circle at 10% 20%, rgba(127, 84, 215, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 90% 80%, rgba(176, 143, 255, 0.08) 0%, transparent 45%);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: pageFadeIn 0.6s ease-out;
}
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-wrap {
  width: 100%;
  max-width: 440px;
}
.auth-card {
  backdrop-filter: var(--glass-blur);
  background: var(--card-bg);
  border: 1px solid rgba(127, 84, 215, 0.25);
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 0 35px rgba(127, 84, 215, 0.15);
}
.auth-title {
  text-align: center;
  font-size: 26px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, var(--light-purple), #ffffff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub-tip {
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 28px;
}
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid rgba(127, 84, 215, 0.2);
}
.tab-btn {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
  position: relative;
}
.tab-btn.active {
  color: var(--light-purple);
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--main-purple);
}
.form-box {
  display: none;
}
.form-box.show {
  display: block;
}
input {
  width: 100%;
  background: rgba(15,15,30,0.6);
  border: 1px solid rgba(127, 84, 215, 0.22);
  border-radius: 12px;
  padding: 13px 16px;
  margin: 10px 0;
  color: #fff;
  font-size: 15px;
  transition: 0.3s;
}
input:focus {
  outline: none;
  border-color: var(--light-purple);
  box-shadow: 0 0 16px rgba(176, 143, 255, 0.32);
}
.submit-btn {
  width: 100%;
  margin-top: 12px;
  background: linear-gradient(135deg, var(--main-purple), #915cf0);
  border: none;
  color: white;
  padding: 13px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.submit-btn:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 20px rgba(127, 84, 215, 0.5);
  transform: translateY(-2px);
}
.back-home {
  text-align: center;
  margin-top: 22px;
}
.back-home a {
  color: var(--light-purple);
  text-decoration: none;
  font-size: 14px;
}
.back-home a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">洛谷题解站</h1>
    <p class="sub-tip">登录账号发布、管理你的题解</p>

    <div class="tab-bar">
      <button class="tab-btn active" id="tabLogin">登录</button>
      <button class="tab-btn" id="tabReg">注册</button>
    </div>

    <!-- 登录表单 -->
    <div id="loginForm" class="form-box show">
      <input type="email" id="loginEmail" placeholder="邮箱地址">
      <input type="password" id="loginPwd" placeholder="密码">
      <button class="submit-btn" onclick="doLogin()">立即登录</button>
    </div>

    <!-- 注册表单 -->
    <div id="regForm" class="form-box">
      <input type="email" id="regEmail" placeholder="填写邮箱">
      <input type="password" id="regPwd" placeholder="设置密码">
      <button class="submit-btn" onclick="doReg()">注册并去验证邮箱</button>
    </div>

    <div class="back-home">
      <a href="index.html">← 返回题解首页</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lvvbvxjqpecjyumrtbgi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dmJ2eGpxcGVjanl1bXJ0YmdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjQ5MjYsImV4cCI6MjA5NzYwMDkyNn0.N90WEhvUllsBHekYbiMQIixhKUSFXu00P9gKI4ZRAoM";
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 切换登录/注册标签
const tabLogin = document.getElementById('tabLogin');
const tabReg = document.getElementById('tabReg');
const loginForm = document.getElementById('loginForm');
const regForm = document.getElementById('regForm');

tabLogin.onclick = ()=>{
  tabLogin.classList.add('active');
  tabReg.classList.remove('active');
  loginForm.classList.add('show');
  regForm.classList.remove('show');
}
tabReg.onclick = ()=>{
  tabReg.classList.add('active');
  tabLogin.classList.remove('active');
  regForm.classList.add('show');
  loginForm.classList.remove('show');
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPwd').value.trim();
  if(!email||!pwd) return alert('请填写完整账号密码');
  const {error} = await sbClient.auth.signInWithPassword({email,password:pwd});
  if(error){
    alert("登录失败："+error.message);
  }else{
    alert('登录成功，即将返回首页');
    location.href='index.html';
  }
}

async function doReg(){
  const email = document.getElementById('regEmail').value.trim();
  const pwd = document.getElementById('regPwd').value.trim();
  if(!email||!pwd) return alert('邮箱和密码不能为空');
  const {error} = await sbClient.auth.signUp({email,password:pwd});
  if(error){
    alert("注册失败："+error.message);
  }else{
    alert('注册成功！请前往邮箱查收验证邮件激活账号，激活后再登录');
  }
}
</script>
</body>
</html>
